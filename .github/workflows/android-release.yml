name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (must already exist as a GitHub Release)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and stage
        working-directory: android-app
        run: |
          npm install
          node stage.mjs
          npx cap sync android

      - name: Build debug APK (Gradle debug signing, sideload only)
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk "SpiresOfAzeroth-${TAG}-android.apk"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for release $TAG"; sleep 20
          done
          gh release upload "$TAG" "SpiresOfAzeroth-${TAG}-android.apk" --clobber

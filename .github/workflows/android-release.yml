name: Android release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (must already exist as a GitHub Release)"
        required: true

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and stage
        working-directory: android-app
        run: |
          npm install
          node stage.mjs
          npx cap sync android

      - name: Prepare stable signing key (optional)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/spires-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/spires-release.jks" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
            echo "Signing with the stable keystore"
          else
            echo "ANDROID_KEYSTORE_B64 not set: falling back to the per-run debug key (updates will need an uninstall)"
          fi

      - name: Build APK (stable key if provided, else Gradle debug key; sideload only)
        working-directory: android-app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android-app/android/app/build/outputs/apk/debug/app-debug.apk "SpiresOfAzeroth-${TAG}-android.apk"

      - name: Upload to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for i in $(seq 1 30); do
            gh release view "$TAG" >/dev/null 2>&1 && break
            echo "waiting for release $TAG"; sleep 20
          done
          gh release upload "$TAG" "SpiresOfAzeroth-${TAG}-android.apk" --clobber
